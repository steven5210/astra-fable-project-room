name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
        shard: [0, 1, 2, 3, 4]
        exclude:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # The offline suite runs as five module-level shards balanced by the pinned
    # per-module weights in tests/shard_weights.json; each shard job runs its
    # modules through a bounded worker pool (2 on macOS, 3 on Linux -- one core
    # of headroom for the runner, subprocess bursts and the OS). Timing
    # records and the diagnostic summary job are never required checks.
    # 45 minutes is a CI budget, not a Fable, model or gate deadline.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - name: Run macOS tests with fake model and MCP backends
        if: runner.os == 'macOS'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          PROJECT_ROOM_TIMING_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PROJECT_ROOM_TIMING_RUN_ID: ${{ github.run_id }}
        run: python tests/run_test_shards.py --shard ${{ matrix.shard }} --shards 5 --workers 2 -v --record "$RUNNER_TEMP/timing"
      - name: Run Linux tests in an isolated process namespace
        if: runner.os == 'Linux'
        env:
          PROJECT_ROOM_TEST_IMAGE: python:${{ matrix.python }}-bookworm
          PROJECT_ROOM_TIMING_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PROJECT_ROOM_TIMING_RUN_ID: ${{ github.run_id }}
        run: |
          # Hosted runner services can deny same-user /proc reads. Keep that
          # production refusal intact and inspect only this test container's processes.
          # --init supplies an init process that reaps orphaned test processes: without
          # one, a same-user zombie keeps a root-owned /proc/<pid>/environ, and the
          # fail-closed marker scan correctly refuses to launch anything.
          docker pull "$PROJECT_ROOM_TEST_IMAGE"
          project_room_candidate="$(mktemp -d "${RUNNER_TEMP}/project-room-tests.XXXXXX")"
          git archive HEAD | tar -x -C "$project_room_candidate"
          timing_dir="${RUNNER_TEMP}/timing"
          mkdir -p "$timing_dir"
          docker run --rm --init --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --mount "type=bind,source=$project_room_candidate,target=/candidate,readonly" \
            --mount "type=bind,source=$timing_dir,target=/timing" \
            --workdir /candidate --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null --env GIT_CONFIG_NOSYSTEM=1 \
            --env PROJECT_ROOM_TIMING_REVISION --env PROJECT_ROOM_TIMING_RUN_ID \
            "$PROJECT_ROOM_TEST_IMAGE" python -B tests/run_test_shards.py --shard "${{ matrix.shard }}" --shards 5 --workers 3 -v --record /timing
      - name: Upload per-test timing record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.os }}-py${{ matrix.python }}-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/timing/*.json
          if-no-files-found: warn
          retention-days: 30

  timing-summary:
    needs: unittest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    # Diagnostic only: it must never be a required check and never hide the
    # unittest results, which remain the gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download timing records
        uses: actions/download-artifact@v4
        with:
          pattern: timing-*
          path: ${{ runner.temp }}/timing-artifacts
          merge-multiple: false
      - name: Fetch job timings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" > "$RUNNER_TEMP/jobs.json"
      - name: Fetch recent main baselines
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/ci_timing_baseline.py --repo "${{ github.repository }}" --workflow tests.yml --out "$RUNNER_TEMP/baselines" --skip-run-id "${{ github.run_id }}"
      - name: Build the timing summary
        if: always()
        env:
          PROJECT_ROOM_TIMING_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/ci_timing_summary.py --records "$RUNNER_TEMP/timing-artifacts" --jobs "$RUNNER_TEMP/jobs.json" --combined "$RUNNER_TEMP/timing-combined.json" --markdown "$GITHUB_STEP_SUMMARY" --baselines "$RUNNER_TEMP/baselines" --weights tests/shard_weights.json
      - name: Upload combined timing summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-summary
          path: ${{ runner.temp }}/timing-combined.json
          if-no-files-found: warn
          retention-days: 90

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyflakes==3.2.0
      - name: Pyflakes (star-import notices in the changeset modules are intentional)
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pyflakes", "."], capture_output=True, text=True)
          ignored = ("may be undefined, or defined from star imports", "used; unable to detect undefined names")
          problems = [line for line in (out.stdout + out.stderr).splitlines()
                      if line.strip() and not any(text in line for text in ignored)]
          print("\n".join(problems))
          sys.exit(1 if problems else 0)
          PY
