name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
        shard: [0, 1, 2, 3, 4]
        exclude:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # The offline suite (about 2,200 tests) runs as five module-level shards balanced by
    # measured duration (tests/shard_weights.json). Measured on the #142 main run:
    # unbalanced four-way shards took 12-20 minutes on macOS and 5-12 on Linux; balanced
    # five-way shards are estimated at about 11 minutes on macOS and 6 on Linux. macOS
    # runs Python 3.11 only because the account runs about five macOS jobs at a time and
    # 3.11 is the production interpreter. This is a CI budget, not a Fable, model or gate
    # deadline.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - name: Run macOS tests with fake model and MCP backends
        if: runner.os == 'macOS'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: python tests/run_test_shards.py --shard ${{ matrix.shard }} --shards 5 -v
      - name: Run Linux tests in an isolated process namespace
        if: runner.os == 'Linux'
        env:
          PROJECT_ROOM_TEST_IMAGE: python:${{ matrix.python }}-bookworm
        run: |
          # Hosted runner services can deny same-user /proc reads. Keep that
          # production refusal intact and inspect only this test container's processes.
          # --init supplies an init process that reaps orphaned test processes: without
          # one, a same-user zombie keeps a root-owned /proc/<pid>/environ, and the
          # fail-closed marker scan correctly refuses to launch anything.
          docker pull "$PROJECT_ROOM_TEST_IMAGE"
          project_room_candidate="$(mktemp -d "${RUNNER_TEMP}/project-room-tests.XXXXXX")"
          git archive HEAD | tar -x -C "$project_room_candidate"
          docker run --rm --init --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --mount "type=bind,source=$project_room_candidate,target=/candidate,readonly" \
            --workdir /candidate --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null --env GIT_CONFIG_NOSYSTEM=1 \
            "$PROJECT_ROOM_TEST_IMAGE" python -B tests/run_test_shards.py --shard "${{ matrix.shard }}" --shards 5 -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyflakes==3.2.0
      - name: Pyflakes (star-import notices in the changeset modules are intentional)
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pyflakes", "."], capture_output=True, text=True)
          ignored = ("may be undefined, or defined from star imports", "used; unable to detect undefined names")
          problems = [line for line in (out.stdout + out.stderr).splitlines()
                      if line.strip() and not any(text in line for text in ignored)]
          print("\n".join(problems))
          sys.exit(1 if problems else 0)
          PY
